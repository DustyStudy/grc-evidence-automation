version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "terraform"
    directories:
      - "/deploy/terraform"
      - "/deploy/terraform/reader_role"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
