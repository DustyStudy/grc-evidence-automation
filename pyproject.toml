[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grc-evidence-automation"
version = "0.1.0"
description = "Scheduled AWS (and optional GCP) control-evidence collectors mapped to SOC 2, ISO 27001:2022 and NIST 800-53, pushed to an S3 evidence store or a GRC-platform ingestion API."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Dusty" }]
keywords = ["grc", "soc2", "iso27001", "compliance-automation", "evidence", "aws", "lambda", "fedramp", "nist-800-53"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "boto3>=1.34",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
gcp = [
    "google-cloud-storage>=2.16",
    "google-cloud-compute>=1.19",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "moto[iam,s3,cloudtrail,kms,ec2,rds,guardduty,securityhub,config,backup,sts,secretsmanager,ssm]>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "boto3-stubs[iam,s3,cloudtrail,kms,ec2,rds,guardduty,securityhub,config,backup,sts,secretsmanager,ssm]>=1.34",
]

[project.scripts]
grc-evidence = "grcevidence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
grcevidence = ["py.typed", "data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning:botocore.*", "ignore::DeprecationWarning:moto.*"]

[tool.coverage.run]
source = ["grcevidence"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
# Status.PASS = "pass" is an enum member, not a password.
"src/grcevidence/models.py" = ["S105"]

[tool.mypy]
python_version = "3.11"
packages = ["grcevidence"]
mypy_path = "src"
explicit_package_bases = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
disallow_untyped_defs = true
