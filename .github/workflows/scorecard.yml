name: Scorecard

# OpenSSF Scorecard: independent, automated checks of this repository's supply-chain practices.
# Results are published to the public Scorecard API (api.scorecard.dev). They are deliberately
# not uploaded to code scanning: several checks (Code-Review, Maintained, Fuzzing) score project
# process, not code, and would show up as high-severity alerts on a solo-maintained repository.
on:
  workflow_dispatch: # run on demand, e.g. right after a release
  branch_protection_rule:
  schedule:
    - cron: "30 5 * * 1"
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write # publish results to the Scorecard API
      contents: read
      actions: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            *.actions.githubusercontent.com:443
            api.scorecard.dev:443
            api.deps.dev:443
            api.osv.dev:443
            www.bestpractices.dev:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            oss-fuzz-build-logs.storage.googleapis.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
