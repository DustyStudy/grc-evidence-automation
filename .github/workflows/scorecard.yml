name: Scorecard

# OpenSSF Scorecard: independent, automated checks of this repository's supply-chain practices.
# Results are published to the public Scorecard API (api.scorecard.dev). They are deliberately
# not uploaded to code scanning: several checks (Code-Review, Maintained, Fuzzing) score project
# process, not code, and would show up as high-severity alerts on a solo-maintained repository.
on:
  workflow_dispatch: # run on demand, e.g. right after a release
  branch_protection_rule:
  schedule:
    - cron: "30 5 * * 1"
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write # publish results to the Scorecard API
      contents: read
      actions: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
