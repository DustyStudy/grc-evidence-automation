name: Release

# Push a tag like v0.1.0 to build the package and the Lambda deployment zip, generate an SBOM,
# attest build provenance, and publish a GitHub Release with the artifacts attached.
# This workflow does not upload to PyPI.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, tomllib
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          tag = os.environ["TAG"].removeprefix("v")
          assert tag == version, f"tag v{tag} does not match pyproject version {version}"
          PY

      - name: Build sdist and wheel, check metadata
        run: |
          python -m pip install --require-hashes -r requirements/requirements-release-tools.txt
          python -m build
          python -m twine check --strict dist/*.whl dist/*.tar.gz

      - name: Build the Lambda deployment package
        run: python scripts/build_lambda.py

      - name: Generate CycloneDX SBOM of the installed wheel
        # A clean venv holding only the wheel and its runtime dependencies, so the
        # SBOM does not include build or SBOM tooling.
        run: |
          python -m venv sbom-env
          sbom-env/bin/python -m pip install --require-hashes -r requirements/requirements-runtime.txt
          sbom-env/bin/python -m pip install --no-deps dist/*.whl
          cyclonedx-py environment --of JSON -o dist/sbom.cdx.json sbom-env/bin/python

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release
      id-token: write # sign the provenance attestation
      attestations: write # store it
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Attach the attestation bundle to the release
        # Scorecard and offline verifiers look for a signature or provenance file next to the
        # artifacts. The bundle covers every artifact above; prove it verifies them before it ships.
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          base="${GITHUB_REPOSITORY#*/}-${TAG}"
          cp "$BUNDLE" "dist/${base}.intoto.jsonl"
          head -n 1 "$BUNDLE" > "dist/${base}.sigstore.json"
          for f in dist/*.whl dist/*.tar.gz dist/*.zip dist/sbom.cdx.json; do
            gh attestation verify "$f" --bundle "dist/${base}.sigstore.json" --repo "$GITHUB_REPOSITORY"
          done

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag
